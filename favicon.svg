<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#132A6E" />

  <!-- suitcase handle -->
  <path
    d="M26 20 a6 6 0 0 1 12 0 v4 h-12 z"
    fill="none"
    stroke="#132A6E"
    stroke-width="3.5"
  />
  <path
    d="M26 20 a6 6 0 0 1 12 0 v4 h-12 z"
    fill="none"
    stroke="#F2B705"
    stroke-width="2"
  />

  <!-- suitcase body -->
  <rect x="17" y="24" width="30" height="25" rx="5" fill="#F2B705" />
  <rect x="17" y="34.5" width="30" height="4" fill="#132A6E" opacity="0.9" />

  <!-- wheels -->
  <circle cx="24" cy="51" r="2.4" fill="#132A6E" />
  <circle cx="40" cy="51" r="2.4" fill="#132A6E" />

  <!-- location-pin accent, echoing the flyer's pin mark -->
  <circle cx="49" cy="15" r="7.5" fill="#F2B705" />
  <circle cx="49" cy="15" r="2.6" fill="#132A6E" />
</svg>
